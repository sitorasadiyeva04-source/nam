<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Nationality by Name</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Guess Nationality <span>by Name</span></h1>
            <p>Type a name and let the AI guess the most likely nationalities</p>
        </div>

        <div class="input-box">
            <input type="text" id="name-input" placeholder="Enter a name">
        </div>

        <button id="submit-button">Submit</button>

        <div id="result"></div>

        <p class="footer">AI-powered predictions • For entertainment purposes only</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
